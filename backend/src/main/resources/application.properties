spring.application.name=booksphere

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booksphere_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:BookSphereSuperSecretJwtKeyForLibraryManagementSystem2026SecureKey}
jwt.expiration=86400000
